# Fast checks on every push: PEP 8 + PEP 257 (ruff), the 1000-line limit, unit tests.
# The full platform (make demo / make chaos) needs Docker and runs locally.
name: ci
on: [push, pull_request]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q tests/unit
        env:
          PYTHONPATH: src
